[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigconfide"
version = "1.0.0"
description = "Mutational signature exposure estimation and active-signature selection via QP and bootstrap"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Marcin Wierzbiński", email = "marcin119a@gmail.com" },
    { name = "Damian Wojtowicz" },
]
keywords = ["mutational signatures", "cancer genomics", "COSMIC", "bioinformatics"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "quadprog",
    "pandas",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/wojtowicz-lab/sigconfide"
Repository = "https://github.com/wojtowicz-lab/sigconfide"
Issues = "https://github.com/wojtowicz-lab/sigconfide/issues"

[project.scripts]
sigconfide = "sigconfide.cli:main"

[project.optional-dependencies]
dev = [
    "gdown",
    "ipykernel",
    "matplotlib",
    "pytest",
]
docs = [
    "black",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.setuptools]
packages = [
    "sigconfide",
    "sigconfide.decompose",
    "sigconfide.estimates",
    "sigconfide.io",
    "sigconfide.utils",
]

[tool.setuptools.package-dir]
"sigconfide"            = "src"
"sigconfide.decompose"  = "src/decompose"
"sigconfide.estimates"  = "src/estimates"
"sigconfide.io"         = "src/io"
"sigconfide.utils"      = "src/utils"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
